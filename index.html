<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바다로 떠나는 여행 가이드</title>
  <meta name="description" content="전국 해수욕장의 운영 시간과 편의시설을 한눈에 확인하세요.">
  <style>
    :root{--navy:#10283a;--ink:#132e3d;--muted:#6b808c;--line:#dbe7eb;--sand:#f8f4ec;--aqua:#bfe9e4;--mint:#e5f5f1;--coral:#ef715a;--yellow:#ffd36a;--white:#fff;--shadow:0 16px 44px rgba(16,40,58,.09)}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:ui-rounded,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:var(--sand)}
    button{font:inherit;border:0;cursor:pointer}.wrap{max-width:1220px;margin:auto;padding:0 28px}
    header{height:78px;background:rgba(248,244,236,.92);display:flex;align-items:center;border-bottom:1px solid rgba(219,231,235,.65);position:sticky;top:0;z-index:5;backdrop-filter:blur(14px)}
    .header-inner{display:flex;width:100%;align-items:center;justify-content:space-between}.logo{font-weight:900;font-size:22px;letter-spacing:-1.3px;display:flex;gap:9px;align-items:center}.logo-mark{width:31px;height:31px;border-radius:12px 12px 12px 4px;background:var(--coral);display:grid;place-items:center;color:#fff;font-size:18px;transform:rotate(-10deg)}.nav{display:flex;align-items:center;gap:27px;color:#75878f;font-size:14px;font-weight:700}.nav a{color:inherit;text-decoration:none}.nav a.active{color:var(--ink)}.header-btn{background:var(--navy);color:#fff;border-radius:99px;padding:11px 18px;font-weight:800;font-size:13px}
    .hero{padding:64px 0 48px;background:linear-gradient(135deg,#bfe9e4 0%,#d9f2e6 52%,#f8f4ec 100%);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:470px;height:220px;border-radius:50%;right:-100px;bottom:-130px;background:rgba(255,255,255,.32);transform:rotate(-12deg)}.eyebrow{font-size:12px;color:#267d7b;font-weight:900;letter-spacing:1.7px;margin-bottom:16px}.hero h1{font-size:clamp(36px,5.4vw,66px);line-height:1.06;letter-spacing:-4px;margin:0 0 17px;max-width:660px}.hero h1 span{color:var(--coral)}.hero p{margin:0;color:#47636e;font-size:16px;line-height:1.7}.search{margin-top:34px;display:flex;max-width:590px;background:#fff;border-radius:17px;padding:7px;box-shadow:0 10px 28px rgba(17,64,72,.1);position:relative;z-index:1}.search input{border:0;outline:0;flex:1;min-width:0;padding:12px 15px;background:transparent;color:var(--ink);font-size:14px}.search button{background:var(--coral);color:#fff;border-radius:12px;padding:0 22px;font-weight:900}
    .content{padding:42px 0 80px}.section-top{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.section-top h2{font-size:24px;letter-spacing:-1.4px;margin:0}.section-top p{color:var(--muted);font-size:13px;margin:7px 0 0}.near{color:#62818b;background:none;font-size:13px;font-weight:800}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:27px}.filter{padding:10px 14px;border-radius:99px;background:#fff;color:#6c7d85;border:1px solid transparent;font-size:12px;font-weight:800}.filter.selected{background:var(--navy);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);transition:.2s transform,.2s box-shadow}.card:hover{transform:translateY(-3px);box-shadow:0 20px 50px rgba(16,40,58,.15)}.thumb{height:158px;position:relative;padding:15px;display:flex;align-items:end}.thumb.jeju{background:linear-gradient(135deg,#ffd989,#82d6c9 57%,#328fa6)}.thumb.busan{background:linear-gradient(135deg,#8cd6d6,#49b3ce 54%,#23678b)}.thumb.sokcho{background:linear-gradient(135deg,#eebd7f,#f49b6a 54%,#3d9bb7)}.thumb:before{content:"";position:absolute;left:-7%;bottom:-25%;width:120%;height:70%;background:rgba(255,255,255,.22);border-radius:50% 50% 0 0;transform:rotate(-6deg)}.tag{position:relative;background:rgba(255,255,255,.91);padding:6px 9px;border-radius:8px;font-size:11px;font-weight:900}.heart{position:absolute;right:14px;top:13px;width:31px;height:31px;background:rgba(255,255,255,.88);border-radius:50%;color:var(--coral);font-size:17px;display:grid;place-items:center}.card-body{padding:17px 18px 18px}.card h3{font-size:18px;margin:0 0 5px;letter-spacing:-.8px}.location{font-size:12px;color:var(--muted);margin:0 0 15px}.amenities{display:flex;gap:6px;flex-wrap:wrap}.amenity{padding:6px 8px;background:#f2f7f7;border-radius:7px;color:#54717b;font-size:11px;font-weight:700}.card-foot{border-top:1px solid #edf2f2;margin-top:17px;padding-top:12px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#809197}.status{font-weight:900;color:#2d9585}.empty{padding:40px;text-align:center;color:var(--muted);background:#fff;border-radius:16px;grid-column:1/-1}
    .tip{margin-top:50px;background:var(--navy);border-radius:22px;padding:27px 31px;color:#fff;display:flex;justify-content:space-between;align-items:center;overflow:hidden;position:relative}.tip:after{content:"☀";position:absolute;right:35px;top:-15px;color:rgba(255,255,255,.12);font-size:135px}.tip small{color:#a7d9d2;font-weight:900;font-size:11px;letter-spacing:1px}.tip h3{font-size:20px;letter-spacing:-1px;margin:8px 0 4px}.tip p{margin:0;color:#b9cbd0;font-size:12px}.tip button{z-index:1;background:var(--yellow);color:#5b4c24;border-radius:10px;padding:11px 15px;font-size:12px;font-weight:900}
    .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,35,47,.45);z-index:10;padding:18px;align-items:center;justify-content:center}.modal-backdrop.open{display:flex}.modal{background:var(--sand);border-radius:22px;max-width:480px;width:100%;padding:27px;position:relative;box-shadow:0 25px 90px rgba(0,0,0,.22)}.close{position:absolute;right:18px;top:17px;background:#fff;width:30px;height:30px;border-radius:50%;font-size:20px;color:var(--muted)}.modal h2{margin:18px 0 5px;font-size:26px;letter-spacing:-1.5px}.modal .location{margin-bottom:20px}.info-row{display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-top:1px solid var(--line);font-size:13px}.info-row strong{color:var(--coral)}.share-btn{width:100%;background:var(--navy);color:#fff;border-radius:11px;padding:13px;margin-top:15px;font-weight:900}footer{border-top:1px solid var(--line);padding:24px 0;color:#84939a;font-size:11px}.footer-in{display:flex;justify-content:space-between}
    @media(max-width:800px){.nav a:not(.active){display:none}.grid{grid-template-columns:repeat(2,1fr)}.hero{padding-top:48px}.tip{align-items:start;gap:16px;flex-direction:column}.tip button{align-self:flex-start}.tip:after{right:-6px}}@media(max-width:520px){.wrap{padding:0 18px}.header-btn{padding:10px 12px}.grid{grid-template-columns:1fr}.section-top{align-items:start;gap:10px}.section-top h2{font-size:21px}.hero h1{letter-spacing:-2.4px}.search button{padding:0 14px}.thumb{height:170px}}
  </style>
</head>
<body>
  <header><div class="wrap header-inner"><div class="logo"><span class="logo-mark">✦</span>바다여행</div><nav class="nav"><a class="active" href="#beaches">해수욕장 찾기</a><a href="#guide">이용 가이드</a><a href="#about">서비스 소개</a><button class="header-btn" id="shareTop">친구에게 공유</button></nav></div></header>
  <main>
    <section class="hero"><div class="wrap"><div class="eyebrow">SUMMER, MADE EASY</div><h1>바다로 가기 전,<br><span>편의시설</span>부터 확인해요.</h1><p>전국 해수욕장의 운영 시간, 샤워실, 주차장과<br>반려동물 동반 가능 여부를 모아봤어요.</p><div class="search"><input id="searchInput" placeholder="해수욕장이나 지역을 검색해보세요" aria-label="해수욕장 검색"><button id="searchBtn">검색</button></div></div></section>
    <section class="content wrap" id="beaches"><div class="section-top"><div><h2>지금 많이 찾는 해수욕장</h2><p id="resultCount"></p></div><button class="near" id="nearBtn">부산만 보기</button></div><div class="filters" aria-label="편의시설 필터"><button class="filter selected" data-filter="all">전체</button><button class="filter" data-filter="샤워실">샤워실</button><button class="filter" data-filter="주차장">주차장</button><button class="filter" data-filter="반려동물">반려동물</button><button class="filter" data-filter="무장애">무장애</button></div><div class="grid" id="beachGrid"></div><div class="tip" id="guide"><div><small>BEACH TIP</small><h3>방문 전 물때와 날씨를 체크해보세요.</h3><p>안전한 물놀이를 위해 기상청 해양날씨를 확인하면 좋아요.</p></div><button id="weatherBtn">오늘 바다 날씨 보기</button></div></section>
  </main>
  <footer id="about"><div class="wrap footer-in"><span>© 2024 바다여행</span><span>가볍게 떠나고, 바다를 가깝게.</span></div></footer>
  <div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true"><button class="close" id="closeModal" aria-label="닫기">×</button><div class="eyebrow">BEACH DETAIL</div><h2 id="modalTitle"></h2><p class="location" id="modalLocation"></p><div id="modalRows"></div><button class="share-btn" id="shareModal">이 해수욕장 공유하기</button></div></div>
  <script>
    const beaches=[
      {name:'협재 해수욕장',region:'제주 제주시',class:'jeju',tag:'제주 · 에메랄드빛 바다',amenities:['샤워실','주차장','반려동물','무장애'],open:'09:00–19:00',note:'공영주차장 이용 · 물놀이 명소'},
      {name:'광안리 해수욕장',region:'부산 수영구',class:'busan',tag:'부산 · 야경이 아름다운 해변',amenities:['샤워실','주차장','무장애'],open:'상시 개방',note:'민락수변공원 인접 · 대중교통 편리'},
      {name:'속초 해수욕장',region:'강원 속초시',class:'sokcho',tag:'강원 · 넓은 백사장',amenities:['샤워실','주차장','반려동물'],open:'06:00–24:00',note:'속초고속터미널에서 도보 10분'},
      {name:'다대포 해수욕장',region:'부산 사하구',class:'busan',tag:'부산 · 노을 맛집',amenities:['주차장','무장애'],open:'상시 개방',note:'낙조분수 · 생태탐방로'},
      {name:'대천 해수욕장',region:'충남 보령시',class:'jeju',tag:'충남 · 가족 여행',amenities:['샤워실','주차장','반려동물','무장애'],open:'09:00–19:00',note:'머드광장 인접 · 가족 추천'},
      {name:'을왕리 해수욕장',region:'인천 중구',class:'sokcho',tag:'인천 · 일몰 명소',amenities:['샤워실','주차장'],open:'09:00–20:00',note:'인천공항에서 차량 20분'}
    ];
    const grid=document.querySelector('#beachGrid'),count=document.querySelector('#resultCount');let currentFilter='all',query='';
    function render(){const list=beaches.filter(b=>(currentFilter==='all'||b.amenities.includes(currentFilter))&&(`${b.name} ${b.region}`.includes(query)));count.textContent=`편의시설을 확인할 수 있는 해수욕장 ${list.length}곳`;grid.innerHTML=list.length?list.map(b=>`<article class="card" data-index="${beaches.indexOf(b)}"><div class="thumb ${b.class}"><span class="tag">${b.tag}</span><button class="heart" aria-label="찜하기">♡</button></div><div class="card-body"><h3>${b.name}</h3><p class="location">${b.region}</p><div class="amenities">${b.amenities.map(a=>`<span class="amenity">${a}</span>`).join('')}</div><div class="card-foot"><span>${b.note}</span><span class="status">운영 중</span></div></div></article>`).join(''):'<div class="empty">검색 결과가 없어요.<br>다른 해수욕장이나 지역을 찾아보세요.</div>';document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',e=>{if(e.target.classList.contains('heart')){e.target.textContent=e.target.textContent==='♡'?'♥':'♡';return}openModal(beaches[c.dataset.index])}))}
    function openModal(b){document.querySelector('#modalTitle').textContent=b.name;document.querySelector('#modalLocation').textContent=b.region;document.querySelector('#modalRows').innerHTML=`<div class="info-row"><span>이용 시간</span><strong>${b.open}</strong></div><div class="info-row"><span>편의시설</span><span>${b.amenities.join(' · ')}</span></div><div class="info-row"><span>추천 포인트</span><span>${b.note}</span></div>`;document.querySelector('#modalBackdrop').classList.add('open')}
    document.querySelectorAll('.filter').forEach(btn=>btn.onclick=()=>{document.querySelector('.filter.selected').classList.remove('selected');btn.classList.add('selected');currentFilter=btn.dataset.filter;render()});document.querySelector('#searchBtn').onclick=()=>{query=document.querySelector('#searchInput').value.trim();render()};document.querySelector('#searchInput').onkeydown=e=>{if(e.key==='Enter'){query=e.target.value.trim();render()}};document.querySelector('#nearBtn').onclick=()=>{document.querySelector('#searchInput').value='부산';query='부산';render();document.querySelector('#beaches').scrollIntoView({behavior:'smooth'})};document.querySelector('#closeModal').onclick=()=>document.querySelector('#modalBackdrop').classList.remove('open');document.querySelector('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')e.currentTarget.classList.remove('open')};async function share(){try{await navigator.clipboard.writeText(location.href);alert('공유 링크를 복사했어요.')}catch(e){alert('페이지 주소를 복사해 친구에게 보내보세요.')}}document.querySelector('#shareTop').onclick=share;document.querySelector('#shareModal').onclick=share;document.querySelector('#weatherBtn').onclick=()=>alert('기상청 해양날씨 서비스에서 최신 정보를 확인해보세요.');render();
  </script>
</body>
</html>
