    ];
    const grid=document.querySelector('#beachGrid'),count=document.querySelector('#resultCount');let currentFilter='all',query='',activeBeach=null;
    function render(){const list=beaches.filter(b=>(currentFilter==='all'||b.amenities.includes(currentFilter))&&(`${b.name} ${b.region}`.includes(query)));count.textContent=`편의시설 위치를 확인할 수 있는 해수욕장 ${list.length}곳`;grid.innerHTML=list.length?list.map(b=>`<article class="card" data-index="${beaches.indexOf(b)}"><div class="thumb ${b.class}"><span class="tag">${b.tag}</span><button class="heart" aria-label="찜하기">♡</button></div><div class="card-body"><h3>${b.name}</h3><p class="location">${b.region}</p><div class="amenities">${b.amenities.map(a=>`<span class="amenity">${a}</span>`).join('')}</div><div class="amenity-buttons" aria-label="${b.name} 편의시설 위치 보기">${b.amenities.map(a=>{const f=b.facilities[a];return `<button class="amenity-button" data-amenity="${a}" title="${a} 위치 보기"><span class="amenity-icon">${f[0]}</span>${a}</button>`}).join('')}</div><div class="card-foot"><span>${b.note}</span><span class="status">운영 중</span></div></div></article>`).join(''):'<div class="empty">검색 결과가 없어요.<br>다른 해수욕장이나 지역을 찾아보세요.</div>';document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',e=>{if(e.target.closest('.heart')){e.target.closest('.heart').textContent=e.target.closest('.heart').textContent==='♡'?'♥':'♡';return}const amenityButton=e.target.closest('.amenity-button');if(amenityButton){e.stopPropagation();openModal(beaches[c.dataset.index],amenityButton.dataset.amenity);return}openModal(beaches[c.dataset.index])}))}
    function openModal(b,selectedAmenity=''){activeBeach=b;document.querySelector('#modalTitle').textContent=b.name;document.querySelector('#modalLocation').textContent=b.region;document.querySelector('#modalRows').innerHTML=`<div class="info-row"><span>이용 시간</span><strong>${b.open}</strong></div><div class="info-row"><span>추천 포인트</span><span>${b.note}</span></div>`;document.querySelector('#facilityList').innerHTML=b.amenities.map(a=>{const f=b.facilities[a];const selected=a===selectedAmenity?' style="outline:2px solid var(--coral);"':'';return `<div class="facility-item"${selected}><div class="facility-item-icon">${f[0]}</div><div><strong>${a}</strong><span>${f[1]}</span></div><small>${f[2]}</small></div>`}).join('');document.querySelector('#gpsStatus').textContent='GPS 버튼을 누르면 현재 위치 권한을 요청합니다.';document.querySelector('#modalBackdrop').classList.add('open')}
    function distanceKm(lat1,lon1,lat2,lon2){const earthRadius=6371,rad=Math.PI/180,dLat=(lat2-lat1)*rad,dLon=(lon2-lon1)*rad;const a=Math.sin(dLat/2)**2+Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;return earthRadius*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
    function locateUser(){const status=document.querySelector('#gpsStatus');if(!activeBeach)return;if(!navigator.geolocation){status.textContent='이 브라우저에서는 GPS를 지원하지 않아요.';return}status.textContent='현재 위치를 확인하고 있어요…';navigator.geolocation.getCurrentPosition(position=>{const {latitude,longitude,accuracy}=position.coords;const distance=distanceKm(latitude,longitude,activeBeach.coords[0],activeBeach.coords[1]);status.textContent=`현재 위치에서 ${activeBeach.name}까지 약 ${distance<1?Math.round(distance*1000)+'m':distance.toFixed(1)+'km'} · 정확도 ±${Math.round(accuracy)}m`;},error=>{const messages={1:'위치 권한이 거부됐어요. 브라우저 설정에서 허용해주세요.',2:'현재 위치를 확인할 수 없어요.',3:'위치 확인 시간이 초과됐어요.'};status.textContent=messages[error.code]||'GPS 위치 확인에 실패했어요.';},{enableHighAccuracy:true,timeout:10000,maximumAge:60000})}
    document.querySelectorAll('.filter').forEach(btn=>btn.onclick=()=>{document.querySelector('.filter.selected').classList.remove('selected');btn.classList.add('selected');currentFilter=btn.dataset.filter;render()});document.querySelector('#searchBtn').onclick=()=>{query=document.querySelector('#searchInput').value.trim();render()};document.querySelector('#searchInput').onkeydown=e=>{if(e.key==='Enter'){query=e.target.value.trim();render()}};document.querySelector('#nearBtn').onclick=()=>{document.querySelector('#searchInput').value='부산';query='부산';render();document.querySelector('#beaches').scrollIntoView({behavior:'smooth'})};document.querySelector('#gpsBtn').onclick=locateUser;document.querySelector('#closeModal').onclick=()=>document.querySelector('#modalBackdrop').classList.remove('open');document.querySelector('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')e.currentTarget.classList.remove('open')};async function share(){try{await navigator.clipboard.writeText(location.href);alert('공유 링크를 복사했어요.')}catch(e){alert('페이지 주소를 복사해 친구에게 보내보세요.')}}document.querySelector('#shareTop').onclick=share;document.querySelector('#shareModal').onclick=share;document.querySelector('#weatherBtn').onclick=()=>alert('기상청 해양날씨 서비스에서 최신 정보를 확인해보세요.');render();
  </script>
</body>
</html>
