<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>파도 대여 관리</title>
  <style>
    :root { --navy:#0b2141; --blue:#1477c9; --sky:#e9f6ff; --mint:#e9f8f3; --orange:#ff8f3d; --line:#dce6ee; --text:#142033; --muted:#66768a; }
    *{box-sizing:border-box} body{margin:0;background:#f6f9fc;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .app{max-width:1160px;margin:auto;padding:28px 22px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:var(--blue);color:white;display:grid;place-items:center;font-size:24px;box-shadow:0 8px 18px #1477c942}.brand h1{font-size:20px;margin:0}.brand p{font-size:13px;margin:3px 0 0;color:var(--muted)}
    button{border:0;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 6px 14px #1477c938}.primary:hover{background:#0d65ad}.date{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:14px}
    .hero{background:linear-gradient(120deg,#0b2141,#165790);border-radius:22px;padding:28px;color:white;position:relative;overflow:hidden}.hero:after{content:"";width:370px;height:370px;border:48px solid #ffffff18;border-radius:50%;position:absolute;right:-95px;top:-190px}.hero>*{position:relative;z-index:1}.hero h2{font-size:25px;margin:0 0 7px}.hero p{margin:0;color:#cde3f4}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}.stat{padding:16px;border-radius:14px;background:#ffffff14;border:1px solid #ffffff1b}.stat b{display:block;font-size:28px;margin-bottom:3px}.stat span{color:#cde3f4;font-size:13px}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin:30px 0 14px}.section-head h2{font-size:18px;margin:0}.filters{display:flex;gap:8px}.filter{background:white;color:#637184;border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-size:13px}.filter.active{background:#e5f3ff;color:#0968b5;border-color:#b7defb}.inventory{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;display:flex;gap:15px;align-items:center}.icon{height:52px;width:52px;border-radius:14px;display:grid;place-items:center;font-size:28px;background:var(--sky)}.umbrella .icon{background:#fff2e8}.details{flex:1;min-width:0}.details h3{margin:0 0 5px;font-size:16px}.details p{margin:0;color:var(--muted);font-size:13px}.count{text-align:right}.count strong{font-size:21px;color:#087150}.count span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.rent{background:#ecf8f4;color:#087150;border-radius:9px;padding:9px 11px;font-size:13px;white-space:nowrap}.rent:disabled{background:#f0f2f4;color:#a1aab4;cursor:not-allowed}
    .panel{background:#fff;border:1px solid var(--line);border-radius:16px;margin-top:28px;overflow:hidden}.panel-top{padding:18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.panel-top h2{font-size:18px;margin:0}.search{border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:190px;font:inherit;font-size:13px}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:15px 18px;border-bottom:1px solid #edf1f4;font-size:14px}th{font-size:12px;color:var(--muted);font-weight:700;background:#fbfcfd}tr:last-child td{border:0}.badge{padding:5px 9px;border-radius:999px;font-weight:700;font-size:12px}.out{color:#a95604;background:#fff2e3}.returned{color:#087150;background:#e9f8f3}.return{color:#1971b9;background:#eef7ff;border-radius:7px;padding:7px 9px;font-size:12px}.empty{text-align:center;padding:28px;color:var(--muted)}
    dialog{border:0;border-radius:18px;padding:0;width:min(440px,calc(100% - 32px);box-shadow:0 24px 75px #0615264d}dialog::backdrop{background:#07152675}.modal{padding:24px}.modal h2{margin:0 0 6px}.modal p{color:var(--muted);font-size:14px;margin:0 0 20px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;font:inherit}.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:21px}.cancel{padding:11px 14px;border-radius:9px;background:#eef2f5;color:#536273}
    @media(max-width:650px){.top{align-items:flex-start;gap:12px}.top .date{display:none}.stats,.inventory{grid-template-columns:1fr}.hero h2{font-size:21px}.panel{overflow-x:auto}.search{width:135px}th,td{padding:13px 12px}.top .primary{padding:11px}.brand p{display:none}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand"><div class="logo">〰</div><div><h1>파도 대여 관리</h1><p>튜브 · 파라솔 재고를 한눈에</p></div></div><div class="date" id="today"></div></header>
    <section class="hero"><h2>오늘도 안전하고 즐거운 바다 되세요! 🏖️</h2><p>실시간 재고를 확인하고 대여 현황을 관리하세요.</p><div class="stats"><div class="stat"><b id="availableTotal">0</b><span>대여 가능</span></div><div class="stat"><b id="rentedTotal">0</b><span>대여 중</span></div><div class="stat"><b id="revenue">₩0</b><span>오늘 대여 금액</span></div></div></section>
    <div class="section-head"><h2>실시간 재고 현황</h2><div class="filters"><button class="filter active" data-filter="all">전체</button><button class="filter" data-filter="tube">튜브</button><button class="filter" data-filter="umbrella">파라솔</button></div></div>
    <section class="inventory" id="inventory"></section>
    <section class="panel"><div class="panel-top"><h2>오늘의 대여 내역</h2><input class="search" id="search" placeholder="이름 또는 품목 검색" /></div><table><thead><tr><th>고객명</th><th>품목</th><th>대여 시간</th><th>상태</th><th></th></tr></thead><tbody id="rentalRows"></tbody></table></section>
  </main>
  <dialog id="rentalDialog"><form class="modal" id="rentalForm"><h2 id="modalTitle">대여 등록</h2><p id="modalDescription">고객 정보를 입력하면 대여가 등록됩니다.</p><input type="hidden" id="selectedItem"/><div class="field"><label for="customer">고객명</label><input required id="customer" placeholder="예: 김하늘" maxlength="20" /></div><div class="field"><label for="quantity">수량</label><select id="quantity"></select></div><div class="modal-actions"><button type="button" class="cancel" id="closeModal">취소</button><button class="primary" type="submit">대여 등록</button></div></form></dialog>
  <script>
    const items=[{id:'tube-small',type:'tube',name:'성인용 튜브',icon:'🛟',total:24,available:18,price:5000},{id:'tube-kids',type:'tube',name:'어린이용 튜브',icon:'🛟',total:16,available:11,price:4000},{id:'umbrella-basic',type:'umbrella',name:'일반 파라솔',icon:'⛱️',total:20,available:7,price:10000},{id:'umbrella-large',type:'umbrella',name:'대형 파라솔',icon:'⛱️',total:8,available:2,price:15000}];
    let rentals=[{id:1,name:'박서준',item:'일반 파라솔',qty:1,time:'10:20',status:'대여 중',price:10000},{id:2,name:'이서연',item:'성인용 튜브',qty:2,time:'10:05',status:'대여 중',price:10000},{id:3,name:'최민지',item:'어린이용 튜브',qty:1,time:'09:45',status:'반납 완료',price:4000}]; let filter='all'; let currentId=null;
    const won=n=>new Intl.NumberFormat('ko-KR',{style:'currency',currency:'KRW',maximumFractionDigits:0}).format(n);
    document.getElementById('today').textContent=new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'short'}).format(new Date());
    function draw(){const available=items.reduce((a,x)=>a+x.available,0), rented=items.reduce((a,x)=>a+x.total-x.available,0), sales=rentals.reduce((a,x)=>a+x.price,0);document.getElementById('availableTotal').textContent=available;document.getElementById('rentedTotal').textContent=rented;document.getElementById('revenue').textContent=won(sales);
      document.getElementById('inventory').innerHTML=items.filter(x=>filter==='all'||x.type===filter).map(x=>`<article class="item ${x.type==='umbrella'?'umbrella':''}"><div class="icon">${x.icon}</div><div class="details"><h3>${x.name}</h3><p>${won(x.price)} / 1일 · 전체 ${x.total}개</p></div><div class="count"><strong>${x.available}</strong><span>대여 가능</span></div><button class="rent" ${x.available?'':'disabled'} onclick="openRent('${x.id}')">대여</button></article>`).join('');renderRows();}
    function renderRows(){const q=document.getElementById('search').value.trim().toLowerCase();const list=rentals.filter(x=>(x.name+x.item).toLowerCase().includes(q));document.getElementById('rentalRows').innerHTML=list.length?list.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.item} ${x.qty>1?'· '+x.qty+'개':''}</td><td>${x.time}</td><td><span class="badge ${x.status==='대여 중'?'out':'returned'}">${x.status}</span></td><td>${x.status==='대여 중'?`<button class="return" onclick="returnItem(${x.id})">반납 처리</button>`:''}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">검색 결과가 없습니다.</td></tr>'}
    window.openRent=id=>{currentId=id;const item=items.find(x=>x.id===id);document.getElementById('modalTitle').textContent=item.name+' 대여 등록';document.getElementById('selectedItem').value=id;document.getElementById('quantity').innerHTML=Array.from({length:Math.min(item.available,5)},(_,i)=>`<option value="${i+1}">${i+1}개</option>`).join('');document.getElementById('rentalDialog').showModal();document.getElementById('customer').focus()};
    window.returnItem=id=>{const r=rentals.find(x=>x.id===id);if(!r||!confirm(`${r.name} 고객의 ${r.item}을(를) 반납 처리할까요?`))return; r.status='반납 완료';const item=items.find(x=>x.name===r.item);item.available+=r.qty;draw()};
    document.getElementById('rentalForm').addEventListener('submit',e=>{e.preventDefault();const item=items.find(x=>x.id===currentId),qty=+document.getElementById('quantity').value,name=document.getElementById('customer').value.trim();item.available-=qty;rentals.unshift({id:Date.now(),name,item:item.name,qty,time:new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date()),status:'대여 중',price:item.price*qty});document.getElementById('rentalDialog').close();e.target.reset();draw()});
    document.getElementById('closeModal').onclick=()=>document.getElementById('rentalDialog').close();document.getElementById('search').oninput=renderRows;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));draw()});draw();
  </script>
</body>
</html>
